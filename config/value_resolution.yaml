  - nationality
  - membership_type
  - location
  - name

# Columns representing current state rather than historical activity. Metric
# questions should not use these as a proxy for event or transaction counts.
status_filter_column_names:
  - status
  - availability
  - inventory_status
  - stock_status

activity_query_expansion:
  - event
  - events
  - transaction
  - transactions
  - purchase
  - purchases
  - sale
  - sales
