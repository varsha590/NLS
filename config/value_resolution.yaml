  - selling
  - sold
  - purchase
  - purchases
  - purchased
  - buy
  - bought

# Words that double as a metric and as a real value. They only produce a hint
# when an adjacent cue word names the semantic type they belong to.
# No such ambiguous terms in the library schema, so this is empty.
# Example if you ever need one: "fiction": [category]
cued_metric_terms: {}

