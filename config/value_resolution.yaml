thresholds:
  accept_score: 0.88
  ambiguous_gap: 0.08
  min_score: 0.65
  max_candidates: 5

# Columns whose distinct values are worth indexing for value matching.
# Library schema: books.language/format, members.membership_type/status,
# loans.status, fines.status, book_copies.condition/status, staff.role/position,
# branches.city, publishers.country, authors.nationality, categories.category_name
value_column_patterns:
  suffixes:
    - _status
    - _type
    - _category
    - _genre
    - _language
    - _format
    - _condition
    - _role
  exact_names:
    - city
    - country
    - state
    - region
    - status
    - category
    - genre
    - language
    - format
    - condition
    - role
    - position
    - nationality
    - location

excluded_column_names:
  - table_name
  - column_name
  - description
  # - name
  # - first_name
  # - last_name
  # - full_name
  - email
  - phone
  - phone_number
  - address
  - street
  - postal_code
  - zip_code
  - isbn
  - notes
  - embedding
  - relationships
  - business_relevance

# Generic aggregation vocabulary. These words are never treated as values and
# never become mentions.
